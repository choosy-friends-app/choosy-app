{% extends 'core/base.html' %}

{% block content %}
<div class="stack">
  <header class="header-row">
    <div>
      <p class="subtle">Decision time</p>
      <h1>Vote Plan</h1>
    </div>
  </header>

  <article class="card">
    <div style="margin: -16px -16px 16px -16px;">
      <img src="{{ plan.image }}" alt="{{ plan.title }}"
        style="width: 100%; height: 200px; object-fit: cover; border-radius: 16px 16px 0 0;" />
    </div>

    <div>
      <h2 style="margin-bottom: 4px;">{{ plan.title }}</h2>
      <p class="subtle">{{ plan.description }}</p>
      <p style="font-weight: 600; margin-top: 8px;">💵 ${{ plan.price }}</p>

      <div style="display: flex; gap: 12px; margin-top: 20px;">
        <button type="button"
          style="flex: 1; padding: 14px; border-radius: 16px; font-size: 1.5rem; background-color: #f1f3f5; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">❌</button>
        <button type="button"
          style="flex: 1; padding: 14px; border-radius: 16px; font-size: 1.5rem; background-color: #d1ffde; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">✅</button>
      </div>
    </div>
  </article>

  <section class="card" style="margin-top: 16px; padding: 20px;">
    <h2 style="margin-bottom: 16px; font-size: 1.25rem;">📍 Ubicación</h2>

    <iframe width="100%" height="200"
      style="border:0; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);" loading="lazy"
      allowfullscreen
      src="https://maps.google.com/maps?q={{ plan.place_name|urlencode }},{{ plan.address|urlencode }}&t=&z=15&ie=UTF8&iwloc=&output=embed">
    </iframe>

    <a href="https://www.google.com/maps/dir/?api=1&destination={{ plan.place_name|urlencode }},{{ plan.address|urlencode }}"
      target="_blank"
      style="display: flex; align-items: center; justify-content: center; width: 100%; background-color: #007aff; color: white; padding: 16px; border-radius: 100px; text-decoration: none; font-weight: 600; font-size: 1.1rem; box-sizing: border-box; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); transition: opacity 0.2s;">
      Cómo llegar 🗺️
    </a>
  </section>
</div>
{% endblock %}
