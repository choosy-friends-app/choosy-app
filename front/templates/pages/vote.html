{% extends "base.html" %}

{% block content %}
<div class="vote-immersive-universe" id="universe">
    <div class="dynamic-ambient-bg" id="ambient-bg"></div>
    <!-- Fullscreen tint layer -->
    <div id="vote-tint"></div>

    <div class="vote-app-adv" id="vote-app">

        <!-- Branding Header -->
        <div class="vote-brand-header">
            <span class="brand-logo">CHOOSY.<span class="brand-accent">LY</span></span>
            <div class="brand-actions">
                <span class="material-symbols-outlined">group</span>
                <span class="material-symbols-outlined">history</span>
            </div>
        </div>

        <!-- Top Progress -->
        <div class="vote-timeline">
            <div class="tl-progress-bar">
                <div class="tl-fill" id="master-progress"></div>
            </div>
            <div class="tl-label">
                <span id="plan-counter">1</span> / {{ plans.count }}
            </div>
        </div>

        <div class="vote-identity-chip">
            <span class="material-symbols-outlined">person</span>
            <span>Voting as {{ current_voter }}</span>
        </div>

        <!-- Empty State -->
        <div class="vote-empty-state" id="empty-state" style="display: none;">
            <div class="empty-icon">✨</div>
            <h2>All set!</h2>
            <p>Your choices are locked in. Let's see what the group picks!</p>
            <a href="{% url 'dashboard' %}" class="btn-primary-adv" style="text-decoration:none;">Back to Home</a>
        </div>

        <!-- Cards Carrousel Container -->
        <div class="vote-viewport" id="viewport">
            <!-- Swipe Feedback - positioned over viewport -->
            <div class="swipe-feedback swipe-like" id="fb-like">👍 LIKE</div>
            <div class="swipe-feedback swipe-nope" id="fb-nope">👎 NOPE</div>

            <div class="vote-deck-stack" id="deck">
                <!-- Cards rendered via JS -->
            </div>
        </div>

        <!-- Floating Actions -->
        <div class="vote-float-actions" id="controls">
            <button class="fa-btn fa-btn-skip" id="btn-skip">
                <span class="material-symbols-outlined">close</span>
            </button>
            <button class="fa-btn fa-btn-star" id="btn-star">
                <span class="material-symbols-outlined">star</span>
            </button>
            <button class="fa-btn fa-btn-vote" id="btn-love">
                <span class="material-symbols-outlined">done_all</span>
            </button>
        </div>
    </div>
</div>

<script id="plans-data" type="application/json">
[
  {% for plan in plans %}
  {
    "id": {{ plan.id }},
    "title": "{{ plan.title|escapejs }}",
    "description": "{{ plan.description|escapejs }}",
    "price": "{{ plan.price|escapejs }}",
    "tag": "{{ plan.tag|escapejs }}",
    "place": "{{ plan.place_name|escapejs }}",
    "image": "{% if plan.image_url %}{{ plan.image_url }}{% else %}https://images.unsplash.com/photo-1517457373958-b7bdd4587205?q=80&w=800&auto=format&fit=crop{% endif %}"
  }{% if not forloop.last %},{% endif %}
  {% endfor %}
]
</script>

<style>
    :root {
        --pass-glow: rgba(239, 68, 68, 0.4);
        --star-glow: rgba(255, 193, 7, 0.4);
        --vote-glow: rgba(74, 222, 128, 0.4);
    }

    .vote-immersive-universe {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        overflow: hidden;
    }

    .dynamic-ambient-bg {
        position: absolute;
        inset: -10%;
        background-size: cover;
        background-position: center;
        filter: blur(80px) brightness(0.4);
        opacity: 0.6;
        transition: background-image 1s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.5s;
        z-index: 0;
        transform: scale(1.1);
    }

    .dynamic-ambient-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 0%, #000 80%);
    }

    .vote-app-adv {
        width: 100%;
        max-width: 440px;
        height: 92vh;
        display: flex;
        flex-direction: column;
        position: relative;
        padding: 1.5rem;
        z-index: 10;
    }

    .vote-brand-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
    }

    .brand-logo {
        font-family: "Manrope", sans-serif;
        font-weight: 900;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
        color: white;
    }

    .brand-accent {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .brand-actions {
        display: flex;
        gap: 1.2rem;
        color: rgba(255, 255, 255, 0.3);
    }

    .vote-timeline {
        display: flex;
        align-items: center;
        gap: 1.2rem;
        margin-bottom: 2.5rem;
    }

    .vote-identity-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        align-self: flex-start;
        margin-bottom: 1.4rem;
        padding: 0.7rem 1rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.02em;
    }

    .vote-identity-chip .material-symbols-outlined {
        font-size: 1rem;
        color: var(--primary);
    }

    .tl-progress-bar {
        flex: 1;
        height: 3px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 99px;
        overflow: hidden;
    }

    .tl-fill {
        width: 0%;
        height: 100%;
        background: var(--primary);
        box-shadow: 0 0 15px var(--primary);
        transition: width 0.05s linear;
        /* Smooth for timer */
    }

    .pulse-dot {
        width: 8px;
        height: 8px;
        background: var(--primary);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--primary);
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% {
            transform: scale(1);
            opacity: 1;
        }

        50% {
            transform: scale(1.5);
            opacity: 0.5;
        }

        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    .tl-label {
        font-family: "Manrope", sans-serif;
        font-size: 0.8rem;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.4);
    }

    /* Tinder Stack Specifics */
    .vote-viewport {
        flex: 1;
        position: relative;
        margin-bottom: 3.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .vote-deck-stack {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .card-container {
        position: absolute;
        width: 100%;
        height: 100%;
        transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.4s;
        cursor: grab;
    }

    .card-container:active {
        cursor: grabbing;
    }

    .adv-vote-card {
        height: 100%;
        background: #0f0f11;
        border-radius: 3rem;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        box-shadow: 0 50px 120px rgba(0, 0, 0, 0.9);
        border: 2px solid rgba(255, 255, 255, 0.08);
        /* Stronger border */
        transition: border-color 0.1s linear;
    }

    /* Decision Overlays - on card-container, outside overflow:hidden */
    .card-decision-overlay {
        display: none;
        /* Using box-shadow glow on container instead */
    }

    .card-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
    }

    .card-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.8s ease;
    }

    .card-container:hover .card-bg img {
        transform: scale(1.05);
    }

    .card-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.4) 40%, transparent 70%);
    }

    .card-content-adv {
        position: relative;
        padding: 3.5rem 2.2rem;
        z-index: 2;
        background: linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
        backdrop-filter: blur(4px);
    }

    .card-details-panel {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 2rem;
        padding: 1.8rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        margin-top: 1rem;
    }

    .card-tags {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 1.2rem;
    }

    .tag-pill {
        background: rgba(165, 165, 255, 0.15);
        padding: 0.5rem 1rem;
        border-radius: 99px;
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--primary);
        border: 1px solid rgba(165, 165, 255, 0.2);
    }

    .card-details-panel h2 {
        font-family: "Manrope", sans-serif;
        font-size: 2.2rem;
        font-weight: 900;
        margin-bottom: 0.6rem;
        line-height: 1.1;
        color: white;
        letter-spacing: -0.03em;
    }

    .card-details-panel p {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
    }

    .card-meta-row {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        color: rgba(255, 255, 255, 0.3);
        font-size: 0.85rem;
        font-weight: 700;
    }

    .meta-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .meta-item .material-symbols-outlined {
        font-size: 1.1rem;
    }

    /* Swipe Animations */
    .card-container.is-removed-left {
        transform: translate(-160%, 15%) rotate(-45deg) !important;
        opacity: 0;
    }

    .card-container.is-removed-right {
        transform: translate(160%, 15%) rotate(45deg) !important;
        opacity: 0;
    }

    .swipe-feedback {
        position: fixed;
        /* Fixed to viewport corners */
        top: 10%;
        z-index: 10000;
        padding: 1.5rem 3rem;
        border: 8px solid;
        border-radius: 2rem;
        font-family: "Manrope", sans-serif;
        font-size: 4rem;
        /* Massive */
        font-weight: 1000;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0;
        pointer-events: none;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        transition: opacity 0.1s linear, transform 0.1s linear;
    }

    .swipe-like {
        color: #00ff00;
        /* Neon Green */
        border-color: #00ff00;
        background: rgba(0, 255, 0, 0.2);
        left: 10%;
        transform: rotate(-15deg) scale(0.8);
        box-shadow: 0 0 100px rgba(0, 255, 0, 0.5);
    }

    .swipe-nope {
        color: #ff0000;
        /* Solid Red */
        border-color: #ff0000;
        background: rgba(255, 0, 0, 0.2);
        right: 10%;
        transform: rotate(15deg) scale(0.8);
        box-shadow: 0 0 100px rgba(255, 0, 0, 0.5);
    }

    /* Global tint for decision direction */
    #vote-tint {
        position: fixed;
        inset: 0;
        z-index: 9998;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.1s linear, background-color 0.1s linear;
    }

    /* Float Actions - REDESIGNED FOR GOD MODE */
    .vote-float-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        z-index: 10;
        margin-bottom: 2rem;
    }

    .fa-btn {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 50%;
        background: rgba(20, 20, 22, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
    }

    .fa-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(255, 255, 255, 0.1), transparent);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .fa-btn:hover::after {
        opacity: 1;
    }

    .fa-btn:hover {
        transform: translateY(-8px) scale(1.1);
        color: white;
    }

    .fa-btn-skip:hover {
        background: #ef4444;
        border-color: #ef4444;
        box-shadow: 0 15px 40px var(--pass-glow);
    }

    .fa-btn-star:hover {
        background: #fbbf24;
        border-color: #fbbf24;
        color: #000;
        box-shadow: 0 15px 40px var(--star-glow);
    }

    .fa-btn-vote {
        width: 6rem;
        height: 6rem;
        background: var(--primary);
        color: #000;
        border: none;
        box-shadow: 0 20px 50px rgba(165, 165, 255, 0.4);
    }

    .fa-btn-vote:hover {
        transform: translateY(-10px) scale(1.15) rotate(5deg);
        box-shadow: 0 30px 70px rgba(165, 165, 255, 0.6);
        background: white;
    }

    .fa-btn .material-symbols-outlined {
        font-size: 1.8rem;
        font-variation-settings: 'FILL' 1, 'wght' 700;
    }

    .fa-btn-vote .material-symbols-outlined {
        font-size: 2.2rem;
    }

    .vote-empty-state {
        text-align: center;
        padding: 4rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
    }

    .empty-icon {
        font-size: 4rem;
        filter: drop-shadow(0 0 20px rgba(165, 165, 255, 0.5));
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {

        0%,
        100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-20px);
        }
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const plansData = document.getElementById("plans-data");
        let plans = [];
        try { plans = JSON.parse(plansData.textContent); } catch (e) { console.error(e); }

        const deck = document.getElementById("deck");
        const counter = document.getElementById("plan-counter");
        const masterProgress = document.getElementById("master-progress");
        const ambientBg = document.getElementById("ambient-bg");
        const universe = document.getElementById("universe");
        const feedbackLike = document.querySelector(".swipe-like");
        const feedbackNope = document.querySelector(".swipe-nope");

        const STORY_DURATION = 7000;
        let storyTimer = null;
        let storyStart = 0;
        let isDragging = false;
        let isVoted = false;
        let dragStartX = 0, dragStartY = 0;
        let currentMouseX = window.innerWidth / 2;
        let currentMouseY = window.innerHeight / 2;

        // Physics state
        let targetX = 0, targetY = 0, targetRotate = 0;
        let currentX = 0, currentY = 0, currentRotate = 0;
        const LERP_FACTOR = 0.15;

        if (!plans.length) {
            showEmpty(); // Fallback if no plans
            return;
        }

        const updateAmbient = () => {
            if (plans.length > 0) {
                ambientBg.style.backgroundImage = `url(${plans[0].image})`;
                ambientBg.style.opacity = "0.7";
            }
        };

        const renderStack = () => {
            deck.innerHTML = "";
            isVoted = false;
            targetX = 0; targetY = 0; targetRotate = 0;
            currentX = 0; currentY = 0; currentRotate = 0;

            plans.forEach((plan, idx) => {
                const container = document.createElement("div");
                container.className = "card-container";
                container.style.zIndex = plans.length - idx;

                // Static stack effect
                const scale = 1 - Math.min(idx, 3) * 0.05;
                const yPos = Math.min(idx, 3) * 20;
                container.style.transform = `scale(${scale}) translateY(${yPos}px)`;
                container.style.opacity = idx > 3 ? 0 : 1;

                container.innerHTML = `
                    <article class="adv-vote-card">
                        <div class="card-decision-overlay overlay-like"></div>
                        <div class="card-decision-overlay overlay-nope"></div>
                        <div class="card-bg"><img src="${plan.image}" alt=""></div>
                        <div class="card-content-adv">
                            <div class="card-details-panel">
                                <div class="card-tags">
                                    <span class="tag-pill">$$$</span>
                                    <span class="tag-pill">${plan.tag || 'Experience'}</span>
                                </div>
                                <div class="card-info">
                                    <h2>${plan.title}</h2>
                                    <p>${plan.description || "A premium escape curated exclusively for your group."}</p>
                                    <div class="card-meta-row">
                                        <div class="meta-item"><span class="material-symbols-outlined">location_on</span><span>${plan.place || 'Lleida'}</span></div>
                                        <div class="meta-item"><span class="material-symbols-outlined">schedule</span><span>Tomorrow</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </article>
                `;

                if (idx === 0) initPointer(container);
                deck.appendChild(container);
            });
            updateProgress();
            updateAmbient();
            startStoryTimer();
        };

        const startStoryTimer = () => {
            if (storyTimer) clearInterval(storyTimer);
            storyStart = Date.now();
            storyTimer = setInterval(() => {
                const elapsed = Date.now() - storyStart;
                const progress = (elapsed / STORY_DURATION) * 100;
                masterProgress.style.width = `${progress}%`;
                if (elapsed >= STORY_DURATION && !isDragging) {
                    clearInterval(storyTimer);
                    vote(-1);
                }
            }, 16);
        };

        function initPointer(el) {
            el.onpointerdown = (e) => {
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                el.setPointerCapture(e.pointerId);
            };

            el.onpointermove = (e) => {
                if (!isDragging) return;
                targetX = e.clientX - dragStartX;
                targetY = e.clientY - dragStartY;
                targetRotate = targetX / 20;
            };

            el.onpointerup = (e) => {
                if (!isDragging) return;
                isDragging = false;
                el.releasePointerCapture(e.pointerId);

                if (Math.abs(targetX) > 150) {
                    vote(targetX > 0 ? 1 : -1);
                } else {
                    targetX = 0; targetY = 0; targetRotate = 0;
                }
            };
        }

        const mainLoop = () => {
            requestAnimationFrame(mainLoop);

            if (!plans.length || isVoted) {
                // Keep tint hidden during transition
                document.getElementById("vote-tint").style.opacity = 0;
                document.getElementById("fb-like").style.opacity = 0;
                document.getElementById("fb-nope").style.opacity = 0;
                return;
            }

            const topCard = deck.querySelector(".card-container:first-child");
            if (!topCard) return;

            const voteTint = document.getElementById("vote-tint");
            const fbLike = document.getElementById("fb-like");
            const fbNope = document.getElementById("fb-nope");

            // Magnetic logic if NOT dragging
            if (!isDragging) {
                const xPct = currentMouseX / window.innerWidth;
                targetX = (xPct - 0.5) * 300; // Even wider
                targetRotate = (xPct - 0.5) * 30;
            }

            // Lerp physics
            currentX += (targetX - currentX) * LERP_FACTOR;
            currentY += (targetY - currentY) * LERP_FACTOR;
            currentRotate += (targetRotate - currentRotate) * LERP_FACTOR;

            topCard.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${currentRotate}deg)`;

            // --- EXTREME FEEDBACK ---
            const intensity = Math.min(1, Math.abs(currentX) / 60);

            if (currentX > 5) {
                // LIME GREEN
                fbLike.style.opacity = intensity;
                fbLike.style.transform = `rotate(-15deg) scale(${0.8 + intensity * 0.4})`;
                fbNope.style.opacity = 0;
                voteTint.style.backgroundColor = `rgba(0, 255, 0, ${intensity * 0.4})`;
                voteTint.style.opacity = 1;
                topCard.style.boxShadow = `0 0 150px rgba(0, 255, 0, ${intensity})`;
            } else if (currentX < -5) {
                // PURE RED
                fbNope.style.opacity = intensity;
                fbNope.style.transform = `rotate(15deg) scale(${0.8 + intensity * 0.4})`;
                fbLike.style.opacity = 0;
                voteTint.style.backgroundColor = `rgba(255, 0, 0, ${intensity * 0.4})`;
                voteTint.style.opacity = 1;
                topCard.style.boxShadow = `0 0 150px rgba(255, 0, 0, ${intensity})`;
            } else {
                fbLike.style.opacity = 0;
                fbNope.style.opacity = 0;
                voteTint.style.opacity = 0;
                topCard.style.boxShadow = '';
            }
        };

        window.onmousemove = (e) => {
            currentMouseX = e.clientX;
            currentMouseY = e.clientY;
        };

        universe.onclick = (e) => {
            if (Math.abs(targetX) > 5 || isDragging) return; // Prevent if was drag
            const xPct = e.clientX / window.innerWidth;
            vote(xPct > 0.5 ? 1 : -1);
        };

        const vote = (value) => {
            if (isVoted) return;
            isVoted = true;
            if (storyTimer) clearInterval(storyTimer);

            const topCard = deck.querySelector(".card-container:first-child");
            topCard.style.transition = "transform 0.8s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.5s";
            topCard.style.pointerEvents = "none";

            const outX = value > 0 ? 1000 : -1000;
            topCard.style.transform = `translate(${outX}px, 0) rotate(${value > 0 ? 45 : -45}deg)`;
            topCard.style.opacity = "0";

            const planId = plans[0].id;
            fetch(`/api/vote/${planId}/`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
                body: JSON.stringify({ value })
            });

            setTimeout(() => {
                plans.shift();
                feedbackLike.style.opacity = "0";
                feedbackNope.style.opacity = "0";
                if (plans.length === 0) showFinishedPopup();
                else renderStack();
            }, 600);
        };

        function showFinishedPopup() {
            universe.innerHTML = `
                <div style="position: fixed; inset: 0; background: #000; z-index: 30000; display: flex; align-items: center; justify-content: center;">
                    <div style="text-align: center; animation: popIn 0.8s cubic-bezier(0.19, 1, 0.22, 1);">
                        <div class="empty-icon" style="font-size: 5rem; margin-bottom: 2rem;">🚀</div>
                        <h1 style="font-family: Manrope, sans-serif; font-size: 3rem; font-weight: 900; color: #fff;">Mission Complete</h1>
                        <p style="color: rgba(255,255,255,0.4); font-size: 1.1rem; margin-top: 1rem;">Calculant resultats per al grup...</p>
                        <div class="pulse-dot" style="margin: 3rem auto;"></div>
                    </div>
                </div>
                <style> @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } } </style>
            `;
            setTimeout(() => window.location.href = "/", 3000);
        }

        const updateProgress = () => {
            const total = parseInt("{{ plans.count }}");
            const voted = total - plans.length;
            if (counter) counter.textContent = voted + 1;
        };

        function showEmpty() {
            const viewport = document.getElementById("viewport");
            const controls = document.getElementById("controls");
            const emptyState = document.getElementById("empty-state");
            viewport.style.display = "none";
            controls.style.display = "none";
            emptyState.style.display = "block";
            document.querySelector(".vote-timeline").style.display = "none";
            ambientBg.style.opacity = "0.2";
        }

        document.getElementById("btn-skip").onclick = () => vote(-1);
        document.getElementById("btn-love").onclick = () => vote(1);
        document.getElementById("btn-star").onclick = () => vote(2);

        function getCookie(name) {
            let cv = null;
            if (document.cookie && document.cookie !== '') {
                const coo = document.cookie.split(';');
                for (let i = 0; i < coo.length; i++) {
                    const c = coo[i].trim();
                    if (c.substring(0, name.length + 1) === (name + '=')) {
                        cv = decodeURIComponent(c.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cv;
        }

        renderStack();
        mainLoop();
    });
</script>
{% endblock %}
