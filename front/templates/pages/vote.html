{% extends "base.html" %}

{% block content %}
<div class="vote-immersive-universe" id="universe">
    <div class="dynamic-ambient-bg" id="ambient-bg"></div>

    <div class="vote-app-adv" id="vote-app">

        <!-- Branding Header -->
        <div class="vote-brand-header">
            <span class="brand-logo">CHOOSY.<span class="brand-accent">LY</span></span>
            <div class="brand-actions">
                <span class="material-symbols-outlined">group</span>
                <span class="material-symbols-outlined">history</span>
            </div>
        </div>

        <!-- Top Progress -->
        <div class="vote-timeline">
            <div class="tl-progress-bar">
                <div class="tl-fill" id="master-progress"></div>
            </div>
            <div class="tl-label">
                <span id="plan-counter">1</span> / {{ plans.count }}
            </div>
        </div>

        <!-- Empty State -->
        <div class="vote-empty-state" id="empty-state" style="display: none;">
            <div class="empty-icon">✨</div>
            <h2>All set!</h2>
            <p>Your choices are locked in. Let's see what the group picks!</p>
            <a href="{% url 'dashboard' %}" class="btn-primary-adv" style="text-decoration:none;">Back to Home</a>
        </div>

        <!-- Cards Carrousel Container -->
        <div class="vote-viewport" id="viewport">
            <!-- Swipe Feedback -->
            <div class="swipe-feedback swipe-like">INTERESTED</div>
            <div class="swipe-feedback swipe-nope">PASSED</div>

            <div class="vote-deck-stack" id="deck">
                <!-- Cards rendered via JS -->
            </div>
        </div>

        <!-- Floating Actions -->
        <div class="vote-float-actions" id="controls">
            <button class="fa-btn fa-btn-skip" id="btn-skip">
                <span class="material-symbols-outlined">close</span>
            </button>
            <button class="fa-btn fa-btn-star" id="btn-star">
                <span class="material-symbols-outlined">star</span>
            </button>
            <button class="fa-btn fa-btn-vote" id="btn-love">
                <span class="material-symbols-outlined">done_all</span>
            </button>
        </div>
    </div>
</div>

<script id="plans-data" type="application/json">
[
  {% for plan in plans %}
  {
    "id": {{ plan.id }},
    "title": "{{ plan.title|escapejs }}",
    "description": "{{ plan.description|escapejs }}",
    "price": "{{ plan.price|escapejs }}",
    "tag": "{{ plan.tag|escapejs }}",
    "place": "{{ plan.place_name|escapejs }}",
    "image": "{% if plan.image_url %}{{ plan.image_url }}{% else %}https://images.unsplash.com/photo-1517457373958-b7bdd4587205?q=80&w=800&auto=format&fit=crop{% endif %}"
  }{% if not forloop.last %},{% endif %}
  {% endfor %}
]
</script>

<style>
    :root {
        --pass-glow: rgba(239, 68, 68, 0.4);
        --star-glow: rgba(255, 193, 7, 0.4);
        --vote-glow: rgba(74, 222, 128, 0.4);
    }

    .vote-immersive-universe {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        overflow: hidden;
    }

    .dynamic-ambient-bg {
        position: absolute;
        inset: -10%;
        background-size: cover;
        background-position: center;
        filter: blur(80px) brightness(0.4);
        opacity: 0.6;
        transition: background-image 1s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.5s;
        z-index: 0;
        transform: scale(1.1);
    }

    .dynamic-ambient-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 0%, #000 80%);
    }

    .vote-app-adv {
        width: 100%;
        max-width: 440px;
        height: 92vh;
        display: flex;
        flex-direction: column;
        position: relative;
        padding: 1.5rem;
        z-index: 10;
    }

    .vote-brand-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
    }

    .brand-logo {
        font-family: "Manrope", sans-serif;
        font-weight: 900;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
        color: white;
    }

    .brand-accent {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .brand-actions {
        display: flex;
        gap: 1.2rem;
        color: rgba(255, 255, 255, 0.3);
    }

    .vote-timeline {
        display: flex;
        align-items: center;
        gap: 1.2rem;
        margin-bottom: 2.5rem;
    }

    .tl-progress-bar {
        flex: 1;
        height: 3px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 99px;
        overflow: hidden;
    }

    .tl-fill {
        width: 0%;
        height: 100%;
        background: var(--primary);
        box-shadow: 0 0 15px var(--primary);
        transition: width 0.05s linear;
        /* Smooth for timer */
    }

    .pulse-dot {
        width: 8px;
        height: 8px;
        background: var(--primary);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--primary);
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% {
            transform: scale(1);
            opacity: 1;
        }

        50% {
            transform: scale(1.5);
            opacity: 0.5;
        }

        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    .tl-label {
        font-family: "Manrope", sans-serif;
        font-size: 0.8rem;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.4);
    }

    /* Tinder Stack Specifics */
    .vote-viewport {
        flex: 1;
        position: relative;
        margin-bottom: 3.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .vote-deck-stack {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .card-container {
        position: absolute;
        width: 100%;
        height: 100%;
        transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.4s;
        cursor: grab;
    }

    .card-container:active {
        cursor: grabbing;
    }

    .adv-vote-card {
        height: 100%;
        background: #0f0f11;
        border-radius: 3rem;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        box-shadow: 0 50px 120px rgba(0, 0, 0, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    .card-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.8s ease;
    }

    .card-container:hover .card-bg img {
        transform: scale(1.05);
    }

    .card-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.4) 40%, transparent 70%);
    }

    .card-content-adv {
        position: relative;
        padding: 3.5rem 2.2rem;
        z-index: 2;
        background: linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
        backdrop-filter: blur(4px);
    }

    .card-details-panel {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 2rem;
        padding: 1.8rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        margin-top: 1rem;
    }

    .card-tags {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 1.2rem;
    }

    .tag-pill {
        background: rgba(165, 165, 255, 0.15);
        padding: 0.5rem 1rem;
        border-radius: 99px;
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--primary);
        border: 1px solid rgba(165, 165, 255, 0.2);
    }

    .card-details-panel h2 {
        font-family: "Manrope", sans-serif;
        font-size: 2.2rem;
        font-weight: 900;
        margin-bottom: 0.6rem;
        line-height: 1.1;
        color: white;
        letter-spacing: -0.03em;
    }

    .card-details-panel p {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
    }

    .card-meta-row {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        color: rgba(255, 255, 255, 0.3);
        font-size: 0.85rem;
        font-weight: 700;
    }

    .meta-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .meta-item .material-symbols-outlined {
        font-size: 1.1rem;
    }

    /* Swipe Animations */
    .card-container.is-removed-left {
        transform: translate(-160%, 15%) rotate(-45deg) !important;
        opacity: 0;
    }

    .card-container.is-removed-right {
        transform: translate(160%, 15%) rotate(45deg) !important;
        opacity: 0;
    }

    .swipe-feedback {
        position: absolute;
        top: 25%;
        z-index: 100;
        padding: 1.2rem 2.5rem;
        border: 4px solid;
        border-radius: 1.5rem;
        font-family: "Manrope", sans-serif;
        font-size: 2.22rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        opacity: 0;
        transform: scale(0.7) rotate(-15deg);
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
        backdrop-filter: blur(8px);
    }

    .swipe-like {
        color: #4ade80;
        border-color: #4ade80;
        left: 8%;
        box-shadow: 0 0 50px rgba(74, 222, 128, 0.4);
    }

    .swipe-nope {
        color: #ef4444;
        border-color: #ef4444;
        right: 8%;
        box-shadow: 0 0 50px rgba(239, 68, 68, 0.4);
        transform: scale(0.7) rotate(15deg);
    }

    /* Float Actions - REDESIGNED FOR GOD MODE */
    .vote-float-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        z-index: 10;
        margin-bottom: 2rem;
    }

    .fa-btn {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 50%;
        background: rgba(20, 20, 22, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
    }

    .fa-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(255, 255, 255, 0.1), transparent);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .fa-btn:hover::after {
        opacity: 1;
    }

    .fa-btn:hover {
        transform: translateY(-8px) scale(1.1);
        color: white;
    }

    .fa-btn-skip:hover {
        background: #ef4444;
        border-color: #ef4444;
        box-shadow: 0 15px 40px var(--pass-glow);
    }

    .fa-btn-star:hover {
        background: #fbbf24;
        border-color: #fbbf24;
        color: #000;
        box-shadow: 0 15px 40px var(--star-glow);
    }

    .fa-btn-vote {
        width: 6rem;
        height: 6rem;
        background: var(--primary);
        color: #000;
        border: none;
        box-shadow: 0 20px 50px rgba(165, 165, 255, 0.4);
    }

    .fa-btn-vote:hover {
        transform: translateY(-10px) scale(1.15) rotate(5deg);
        box-shadow: 0 30px 70px rgba(165, 165, 255, 0.6);
        background: white;
    }

    .fa-btn .material-symbols-outlined {
        font-size: 1.8rem;
        font-variation-settings: 'FILL' 1, 'wght' 700;
    }

    .fa-btn-vote .material-symbols-outlined {
        font-size: 2.2rem;
    }

    .vote-empty-state {
        text-align: center;
        padding: 4rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
    }

    .empty-icon {
        font-size: 4rem;
        filter: drop-shadow(0 0 20px rgba(165, 165, 255, 0.5));
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {

        0%,
        100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-20px);
        }
    }
</style>
</style>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const plansData = document.getElementById("plans-data");
        let plans = [];
        try { plans = JSON.parse(plansData.textContent); } catch (e) { console.error(e); }

        const deck = document.getElementById("deck");
        const counter = document.getElementById("plan-counter");
        const masterProgress = document.getElementById("master-progress");
        const emptyState = document.getElementById("empty-state");
        const controls = document.getElementById("controls");
        const viewport = document.getElementById("viewport");
        const feedbackLike = document.querySelector(".swipe-like");
        const feedbackNope = document.querySelector(".swipe-nope");
        const ambientBg = document.getElementById("ambient-bg");
        const universe = document.getElementById("universe");

        const STORY_DURATION = 6000; // 6 seconds per plan
        let storyTimer = null;
        let storyStart = 0;

        if (!plans.length) {
            showEmpty();
            return;
        }

        const updateAmbient = () => {
            if (plans.length > 0) {
                ambientBg.style.backgroundImage = `url(${plans[0].image})`;
                ambientBg.style.opacity = "0.7";
            } else {
                ambientBg.style.opacity = "0.2";
            }
        };

        const renderStack = () => {
            deck.innerHTML = "";
            plans.forEach((plan, idx) => {
                const container = document.createElement("div");
                container.className = "card-container";
                container.style.zIndex = plans.length - idx;
                container.style.transform = `scale(${1 - idx * 0.05}) translateY(${idx * 20}px)`;
                container.style.opacity = idx > 3 ? 0 : 1;

                container.innerHTML = `
                    <article class="adv-vote-card">
                        <div class="card-bg">
                            <img src="${plan.image}" alt="">
                        </div>
                        <div class="card-content-adv">
                            <div class="card-details-panel">
                                <div class="card-tags">
                                    <span class="tag-pill">$$$</span>
                                    <span class="tag-pill">${plan.tag || 'Experience'}</span>
                                </div>
                                <div class="card-info">
                                    <h2>${plan.title}</h2>
                                    <p>${plan.description || "A premium escape curated exclusively for your group's next milestone."}</p>
                                    <div class="card-meta-row">
                                        <div class="meta-item">
                                            <span class="material-symbols-outlined">location_on</span>
                                            <span>${plan.place || 'Lleida'}</span>
                                        </div>
                                        <div class="meta-item">
                                            <span class="material-symbols-outlined">schedule</span>
                                            <span>Tomorrow</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </article>
                `;

                if (idx === 0) initDrag(container);
                deck.appendChild(container);
            });
            updateProgress();
            updateAmbient();
            startStoryTimer();
        };

        const startStoryTimer = () => {
            if (storyTimer) clearInterval(storyTimer);
            storyStart = Date.now();
            storyTimer = setInterval(() => {
                const elapsed = Date.now() - storyStart;
                const progress = (elapsed / STORY_DURATION) * 100;
                masterProgress.style.width = `${progress}%`;

                if (elapsed >= STORY_DURATION) {
                    clearInterval(storyTimer);
                    vote(-1); // Auto-pass if time runs out
                }
            }, 16);
        };

        // Mouse-Magnetic Physics
        window.onmousemove = (e) => {
            if (!plans.length || isDragging) return;

            const topCard = deck.querySelector(".card-container:first-child");
            if (!topCard) return;

            const xPct = e.clientX / window.innerWidth;
            const tilt = (xPct - 0.5) * 30; // Max 15deg tilt
            const moveX = (xPct - 0.5) * 100; // Max 50px move

            topCard.style.transform = `translate(${moveX}px, 0) rotate(${tilt}deg)`;

            // Dynamic Feedback
            if (xPct > 0.8) {
                feedbackLike.style.opacity = (xPct - 0.8) * 5;
                feedbackNope.style.opacity = 0;
            } else if (xPct < 0.2) {
                feedbackNope.style.opacity = (0.2 - xPct) * 5;
                feedbackLike.style.opacity = 0;
            } else {
                feedbackLike.style.opacity = 0;
                feedbackNope.style.opacity = 0;
            }
        };

        // Universal Click Handler
        universe.onclick = (e) => {
            if (isDragging) return;
            const xPct = e.clientX / window.innerWidth;
            vote(xPct > 0.5 ? 1 : -1);
        };

        let isDragging = false;
        let startX, startY, moveX, moveY;

        function initDrag(el) {
            el.onpointerdown = (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                el.style.transition = "none";
            };

            window.onpointermove = (e) => {
                if (!isDragging) return;
                moveX = e.clientX - startX;
                moveY = e.clientY - startY;
                const rotation = moveX / 20;
                el.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${rotation}deg)`;

                // Feedback
                if (moveX > 80) {
                    feedbackLike.style.opacity = Math.min(1, (moveX - 80) / 100);
                    feedbackNope.style.opacity = 0;
                } else if (moveX < -80) {
                    feedbackNope.style.opacity = Math.min(1, (Math.abs(moveX) - 80) / 100);
                    feedbackLike.style.opacity = 0;
                } else {
                    feedbackLike.style.opacity = 0;
                    feedbackNope.style.opacity = 0;
                }
            };

            window.onpointerup = () => {
                if (!isDragging) return;
                isDragging = false;
                el.style.transition = "transform 0.5s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.5s";

                if (Math.abs(moveX) > 150) {
                    vote(moveX > 0 ? 1 : -1);
                } else {
                    el.style.transform = `translate(0,0) rotate(0deg)`;
                    feedbackLike.style.opacity = 0;
                    feedbackNope.style.opacity = 0;
                }
                moveX = 0; moveY = 0;
            };
        }

        const updateProgress = () => {
            const total = parseInt("{{ plans.count }}");
            const voted = total - plans.length;
            counter.textContent = voted + 1;
        };

        const vote = (value) => {
            if (!plans.length) return;
            if (storyTimer) clearInterval(storyTimer);

            const topCard = deck.querySelector(".card-container:first-child");
            const feedback = value > 0 ? feedbackLike : feedbackNope;

            feedback.style.opacity = "1";
            topCard.classList.add(value > 0 ? "is-removed-right" : "is-removed-left");

            const planId = plans[0].id;
            fetch(`/api/vote/${planId}/`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
                body: JSON.stringify({ value })
            });

            setTimeout(() => {
                plans.shift();
                feedbackLike.style.opacity = "0";
                feedbackNope.style.opacity = "0";
                renderStack();
                if (plans.length === 0) showFinishedPopup();
            }, 500);
        };

        function showFinishedPopup() {
            viewport.style.display = "none";
            controls.style.display = "none";
            document.querySelector(".vote-timeline").style.display = "none";
            ambientBg.style.opacity = "0.3";

            const popup = document.createElement("div");
            popup.innerHTML = `
                <div style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); z-index: 20000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.8s ease;">
                    <div style="text-align: center; max-width: 440px; padding: 3rem; border-radius: 3rem; background: #111; border: 1px solid rgba(165,165,255,0.2); box-shadow: 0 40px 100px rgba(0,0,0,0.8);">
                        <div class="empty-icon" style="margin-bottom: 2rem;">👑</div>
                        <h2 style="font-family: Manrope, sans-serif; font-size: 2.22rem; color: #fff; margin-bottom: 1rem;">Decisions Locked</h2>
                        <p style="color: #7f7b84; line-height: 1.6; margin-bottom: 2.5rem;">The voting session is complete. We are now calculating the best path for your group.</p>
                        <div style="display: flex; align-items: center; justify-content: center; gap: 1rem; color: var(--primary); font-weight: 800; letter-spacing: 0.1em; font-size: 0.75rem;">
                            <div class="pulse-dot"></div>
                            SYNCHRONIZING RESULTS...
                        </div>
                    </div>
                </div>
                <style>
                    @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
                </style>
            `;
            document.body.appendChild(popup);

            setTimeout(() => {
                window.location.href = "/dashboard/";
            }, 3000);
        }

        function showEmpty() {
            viewport.style.display = "none";
            controls.style.display = "none";
            emptyState.style.display = "block";
            document.querySelector(".vote-timeline").style.display = "none";
            ambientBg.style.opacity = "0.2";
        }

        document.getElementById("btn-skip").onclick = () => vote(-1);
        document.getElementById("btn-love").onclick = () => vote(1);
        document.getElementById("btn-star").onclick = () => vote(2);

        function getCookie(name) {
            let cv = null;
            if (document.cookie && document.cookie !== '') {
                const coo = document.cookie.split(';');
                for (let i = 0; i < coo.length; i++) {
                    const c = coo[i].trim();
                    if (c.substring(0, name.length + 1) === (name + '=')) {
                        cv = decodeURIComponent(c.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cv;
        }

        renderStack();
    });
</script>
{% endblock %}
