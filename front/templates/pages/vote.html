{% extends "base.html" %}

{% block content %}
<div class="vote-view-wrapper-adv">
    <div class="vote-app-adv" id="vote-app">

        <!-- Branding Header -->
        <div class="vote-brand-header">
            <span class="brand-logo">CHOOSY.<span class="brand-accent">LY</span></span>
            <div class="brand-actions">
                <span class="material-symbols-outlined">group</span>
                <span class="material-symbols-outlined">history</span>
            </div>
        </div>

        <!-- Top Progress -->
        <div class="vote-timeline">
            <div class="tl-progress-bar">
                <div class="tl-fill" id="master-progress"></div>
            </div>
            <div class="tl-label">
                <span id="plan-counter">1</span> / {{ plans.count }}
            </div>
        </div>

        <!-- Empty State -->
        <div class="vote-empty-state" id="empty-state" style="display: none;">
            <div class="empty-icon">✨</div>
            <h2>All set!</h2>
            <p>Your choices are locked in. Let's see what the group picks!</p>
            <a href="{% url 'dashboard' %}" class="btn-primary-adv" style="text-decoration:none;">Back to Home</a>
        </div>

        <!-- Cards Carrousel Container -->
        <div class="vote-viewport" id="viewport">
            <!-- Swipe Feedback -->
            <div class="swipe-feedback swipe-like">INTERESTED</div>
            <div class="swipe-feedback swipe-nope">PASSED</div>

            <div class="vote-deck-stack" id="deck">
                <!-- Cards rendered via JS -->
            </div>
        </div>

        <!-- Floating Actions -->
        <div class="vote-float-actions" id="controls">
            <button class="fa-btn fa-btn-skip" id="btn-skip">
                <span class="material-symbols-outlined">close</span>
            </button>
            <button class="fa-btn fa-btn-star" id="btn-star">
                <span class="material-symbols-outlined">star</span>
            </button>
            <button class="fa-btn fa-btn-vote" id="btn-love">
                <span class="material-symbols-outlined">done_all</span>
            </button>
        </div>
    </div>
</div>

<script id="plans-data" type="application/json">
[
  {% for plan in plans %}
  {
    "id": {{ plan.id }},
    "title": "{{ plan.title|escapejs }}",
    "description": "{{ plan.description|escapejs }}",
    "price": "{{ plan.price|escapejs }}",
    "tag": "{{ plan.tag|escapejs }}",
    "place": "{{ plan.place_name|escapejs }}",
    "image": "{% if plan.image_url %}{{ plan.image_url }}{% else %}https://images.unsplash.com/photo-1517457373958-b7bdd4587205?q=80&w=800&auto=format&fit=crop{% endif %}"
  }{% if not forloop.last %},{% endif %}
  {% endfor %}
]
</script>

<style>
    .vote-view-wrapper-adv {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 5rem);
        background: radial-gradient(circle at 50% 50%, #1e1b2e 0%, #0a0a0c 100%);
        overflow: hidden;
        position: relative;
    }

    /* Ambient light glow */
    .vote-view-wrapper-adv::before {
        content: "";
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(165, 165, 255, 0.08) 0%, transparent 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }

    .vote-app-adv {
        width: 100%;
        max-width: 440px;
        height: 85vh;
        min-height: 700px;
        display: flex;
        flex-direction: column;
        position: relative;
        padding: 1.5rem;
        z-index: 1;
    }

    .vote-brand-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
    }

    .brand-logo {
        font-weight: 900;
        font-size: 1.3rem;
        letter-spacing: 0.15em;
        color: white;
    }

    .brand-accent {
        color: var(--secondary);
    }

    .brand-actions {
        display: flex;
        gap: 1.5rem;
        color: #555;
    }

    .vote-timeline {
        display: flex;
        align-items: center;
        gap: 1.2rem;
        margin-bottom: 3rem;
    }

    .tl-progress-bar {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 99px;
        overflow: hidden;
    }

    .tl-fill {
        width: 0%;
        height: 100%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent-glow);
        transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tl-label {
        font-size: 0.8rem;
        font-weight: 900;
        color: #444;
    }

    /* Tinder Stack Specifics */
    .vote-viewport {
        flex: 1;
        position: relative;
        margin-bottom: 4rem;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .vote-deck-stack {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .card-container {
        position: absolute;
        width: 100%;
        height: 100%;
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
        cursor: grab;
    }

    .card-container:active {
        cursor: grabbing;
    }

    .adv-vote-card {
        height: 100%;
        background: #111;
        border-radius: 2.5rem;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    .card-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.6);
    }

    .card-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, transparent 60%);
    }

    .card-content-adv {
        position: relative;
        padding: 3rem 2rem;
        z-index: 2;
    }

    .card-tags {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.2rem;
    }

    .tag-pill {
        background: rgba(255, 255, 255, 0.05);
        padding: 0.4rem 0.8rem;
        border-radius: 99px;
        font-size: 0.65rem;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--accent);
        border: 1px solid rgba(165, 165, 255, 0.1);
    }

    .card-content-adv h2 {
        font-size: 2.5rem;
        font-weight: 900;
        margin-bottom: 0.8rem;
        line-height: 1.1;
        color: white;
    }

    .card-content-adv p {
        color: #888;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 2rem;
    }

    /* Swipe Animations */
    .card-container.is-removed-left {
        transform: translate(-150%, 10%) rotate(-30deg) !important;
        opacity: 0;
    }

    .card-container.is-removed-right {
        transform: translate(150%, 10%) rotate(30deg) !important;
        opacity: 0;
    }

    .swipe-feedback {
        position: absolute;
        top: 20%;
        z-index: 100;
        padding: 1rem 2rem;
        border: 4px solid;
        border-radius: 12px;
        font-size: 2rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0;
        transform: scale(0.8) rotate(-15deg);
        pointer-events: none;
        transition: 0.2s;
    }

    .swipe-like {
        color: #4ade80;
        border-color: #4ade80;
        left: 10%;
        transform: scale(1) rotate(-15deg);
    }

    .swipe-nope {
        color: #ef4444;
        border-color: #ef4444;
        right: 10%;
        transform: scale(1) rotate(15deg);
    }

    /* Float Actions */
    .vote-float-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        z-index: 10;
        margin-bottom: 1rem;
    }

    .fa-btn {
        width: 4rem;
        height: 4rem;
        border-radius: 50%;
        background: #1a1a1c;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fa-btn:hover {
        transform: scale(1.1);
    }

    .fa-btn-skip:hover {
        background: #ef4444;
        color: white;
        border-color: #ef4444;
    }

    .fa-btn-love {
        width: 5rem;
        height: 5rem;
        background: var(--accent);
        color: #000;
        box-shadow: 0 10px 40px var(--accent-glow);
        border: none;
    }

    .fa-btn-love:hover {
        transform: scale(1.15) rotate(12deg);
    }

    .vote-empty-state {
        text-align: center;
        padding: 4rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
    }
</style>
</style>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const plansData = document.getElementById("plans-data");
        let plans = [];
        try { plans = JSON.parse(plansData.textContent); } catch (e) { console.error(e); }

        const deck = document.getElementById("deck");
        const counter = document.getElementById("plan-counter");
        const masterProgress = document.getElementById("master-progress");
        const emptyState = document.getElementById("empty-state");
        const controls = document.getElementById("controls");
        const viewport = document.getElementById("viewport");
        const feedbackLike = document.querySelector(".swipe-like");
        const feedbackNope = document.querySelector(".swipe-nope");

        let currentActiveId = 0;

        if (!plans.length) {
            showEmpty();
            return;
        }

        const renderStack = () => {
            deck.innerHTML = "";
            plans.forEach((plan, idx) => {
                const container = document.createElement("div");
                container.className = "card-container";
                container.style.zIndex = plans.length - idx;
                container.style.transform = `scale(${1 - idx * 0.05}) translateY(${idx * 20}px)`;
                container.style.opacity = idx > 3 ? 0 : 1;

                container.innerHTML = `
                    <article class="adv-vote-card">
                        <div class="card-bg">
                            <img src="${plan.image}" alt="">
                        </div>
                        <div class="card-content-adv">
                            <div class="card-tags">
                                <span class="tag-pill">$ $ $</span>
                                <span class="tag-pill">${plan.tag || 'Activity'}</span>
                            </div>
                            <h2>${plan.title}</h2>
                            <p>${plan.description || 'Una experiència inoblidable per compartir amb el grup.'}</p>
                        </div>
                    </article>
                `;
                deck.appendChild(container);
            });
            updateProgress();
        };

        const updateProgress = () => {
            const total = parseInt("{{ plans.count }}");
            const voted = total - plans.length;
            counter.textContent = voted + 1;
            masterProgress.style.width = `${((voted + 1) / total) * 100}%`;
        };

        const vote = (value) => {
            if (!plans.length) return;

            const topCard = deck.querySelector(".card-container:first-child");
            const feedback = value > 0 ? feedbackLike : feedbackNope;

            // Show feedback
            feedback.style.opacity = "1";
            setTimeout(() => feedback.style.opacity = "0", 300);

            // Animate card out
            topCard.classList.add(value > 0 ? "is-removed-right" : "is-removed-left");

            const planId = plans[0].id;
            fetch(`/api/vote/${planId}/`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
                body: JSON.stringify({ value })
            });

            setTimeout(() => {
                plans.shift();
                renderStack();
                if (plans.length === 0) showEmpty();
            }, 500);
        };

        function showEmpty() {
            viewport.style.display = "none";
            controls.style.display = "none";
            emptyState.style.display = "block";
            document.querySelector(".vote-timeline").style.display = "none";
        }

        document.getElementById("btn-skip").onclick = () => vote(-1);
        document.getElementById("btn-love").onclick = () => vote(1);
        document.getElementById("btn-star").onclick = () => vote(2);

        function getCookie(name) {
            let cv = null;
            if (document.cookie && document.cookie !== '') {
                const coo = document.cookie.split(';');
                for (let i = 0; i < coo.length; i++) {
                    const c = coo[i].trim();
                    if (c.substring(0, name.length + 1) === (name + '=')) {
                        cv = decodeURIComponent(c.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cv;
        }

        renderStack();
    });
</script>
{% endblock %}
