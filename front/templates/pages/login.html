{% extends "base.html" %}

{% block content %}
  <section class="auth-page">
    <div class="auth-card">
      <p class="page-kicker">Local Authentication</p>
      <h1>Login</h1>

      {% if error_message %}
        <div class="groups-flash groups-flash--error">{{ error_message }}</div>
      {% endif %}

      <form class="auth-form" method="post">
        {% csrf_token %}
        <input class="groups-input" type="text" name="username" placeholder="Username" required />
        <input class="groups-input" type="password" name="password" placeholder="Password" required />
        <button class="groups-hero__action auth-submit" type="submit">Entrar</button>
      </form>

      <p class="auth-switch">No tienes cuenta todavia? <a href="{% url 'register' %}">Crea una ahora</a></p>
    </div>
  </section>
{% endblock %}
