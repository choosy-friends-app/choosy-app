<aside class="app-rail">
  <div class="rail-panel">
    <div class="brand">
      <span class="brand-title">Choosy</span>
      <span class="brand-subtitle">Group Decisions</span>
    </div>

    <nav class="rail-nav" aria-label="Estructura principal">
      <a class="rail-link {% if active_page == 'dashboard' %}is-active{% endif %}" href="{% url 'dashboard' %}">
        <span class="material-symbols-outlined">dashboard</span>
        <span>Dashboard</span>
      </a>
      <a class="rail-link {% if active_page == 'active_plans' %}is-active{% endif %}" href="{% url 'active_plans' %}">
        <span class="material-symbols-outlined">event_repeat</span>
        <span>Active Plans</span>
      </a>
      <a class="rail-link {% if active_page == 'groups' %}is-active{% endif %}" href="{% url 'groups' %}">
        <span class="material-symbols-outlined">groups</span>
        <span>Groups</span>
      </a>
      <a class="rail-link {% if active_page == 'archive' %}is-active{% endif %}" href="{% url 'archive' %}">
        <span class="material-symbols-outlined">inventory_2</span>
        <span>Archive</span>
      </a>
      <span class="rail-link">
        <span class="material-symbols-outlined">settings</span>
        <span>Settings</span>
      </span>
    </nav>

    <div class="rail-foot">
      <a class="rail-cta {% if active_page == 'start_new_plan' %}is-active{% endif %}" href="{% url 'start_new_plan' %}">Start New Plan</a>
      <span class="rail-profile">
        <span class="material-symbols-outlined">account_circle</span>
        <span>Profile</span>
      </span>
    </div>
  </div>
</aside>
