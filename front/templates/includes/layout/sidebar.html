{% load static %}
<aside class="app-rail" id="app-sidebar">
  <div class="rail-panel">
    <div class="brand">
      <a class="brand-lockup" href="{% url 'dashboard' %}" aria-label="Choosy dashboard">
        <img class="brand-logo" src="{% static 'img/choosy-logo-cropped.webp' %}" alt="Choosy logo">
        <span class="brand-title">Choosy</span>
      </a>
    </div>

    <nav class="rail-nav" aria-label="Main structure">
      <a class="rail-link {% if active_page == 'dashboard' %}is-active{% endif %}" href="{% url 'dashboard' %}">
        <span class="material-symbols-outlined">dashboard</span>
        <span>Dashboard</span>
      </a>
      <a class="rail-link {% if active_page == 'active_plans' %}is-active{% endif %}" href="{% url 'active_plans' %}">
        <span class="material-symbols-outlined">event_repeat</span>
        <span>Plans</span>
      </a>
      <a class="rail-link {% if active_page == 'groups' %}is-active{% endif %}" href="{% url 'groups' %}">
        <span class="material-symbols-outlined">groups</span>
        <span>Groups</span>
      </a>
      <a class="rail-link {% if active_page == 'notifications' %}is-active{% endif %}" href="{% url 'notifications' %}">
        <span class="material-symbols-outlined">notifications</span>
        <span>Notifications</span>
      </a>
      <span class="rail-link rail-link--soon">
        <span class="material-symbols-outlined">settings</span>
        <span>Settings</span>
      </span>
    </nav>

    <div class="rail-foot">
      <a class="rail-cta {% if active_page == 'start_new_plan' %}is-active{% endif %}"
        href="{% url 'start_new_plan' %}">Start New Plan</a>
      {% if request.user.is_authenticated %}
      <a class="rail-profile" href="{% url 'groups' %}">
        <span class="material-symbols-outlined">account_circle</span>
        <span>{{ request.user.username }}</span>
      </a>
      <a class="rail-link" href="{% url 'logout' %}">
        <span class="material-symbols-outlined">logout</span>
        <span>Logout</span>
      </a>
      {% else %}
      <a class="rail-profile" href="{% url 'login' %}">
        <span class="material-symbols-outlined">login</span>
        <span>Login</span>
      </a>
      <a class="rail-link" href="{% url 'register' %}">
        <span class="material-symbols-outlined">person_add</span>
        <span>Register</span>
      </a>
      {% endif %}
    </div>
  </div>
</aside>
