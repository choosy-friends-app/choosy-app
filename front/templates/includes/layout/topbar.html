<header class="topbar">
  <div class="search-shell" aria-hidden="true">
    <span class="material-symbols-outlined">search</span>
    <span>Search groups or plans...</span>
  </div>

  <div class="topbar-side">
    <span class="topbar-bell">
      <span class="material-symbols-outlined">notifications</span>
      <span class="topbar-bell__dot"></span>
    </span>

    <div class="session-chip">
      <div>
        <span>{% if request.user.is_authenticated %}Active user{% else %}Session{% endif %}</span>
        <strong>{{ topbar_context|default:"Dashboard" }}</strong>
      </div>
      <span class="session-avatar">
        {% if request.user.is_authenticated %}
          {{ request.user.username|slice:":1"|upper }}
        {% else %}
          G
        {% endif %}
      </span>
    </div>
  </div>
</header>
