<aside class="dashboard-side">
  <section class="side-panel">
    <div class="side-panel__header">
      <h2>Pending Votes</h2>
    </div>
    <div class="vote-stack-preview">
      {% for group in groups %}
      {% if group.voting_plans_count > 0 %}
      <div class="vote-item-godmode">
        <div class="vi-icon">
          <span class="material-symbols-outlined">how_to_vote</span>
        </div>
        <div class="vi-details">
          <strong>{{ group.name }}</strong>
          <span>{{ group.voting_plans_count }} options pending</span>
        </div>
        <a href="{% url 'vote' group.id %}" class="vi-jump">
          <span class="material-symbols-outlined">chevron_right</span>
        </a>
      </div>
      {% endif %}
      {% empty %}
      <p class="muted" style="font-size: 0.8rem; opacity: 0.6;">All caught up! No votes pending.</p>
      {% endfor %}
    </div>
  </section>

  <section class="side-panel">
    <h2>Recent Activity</h2>
    <div class="activity-space" aria-hidden="true"></div>
  </section>

  <article class="promo-card">
    <div class="promo-visual" aria-hidden="true">
      <span class="promo-node promo-node--one"></span>
      <span class="promo-node promo-node--two"></span>
      <span class="promo-node promo-node--three"></span>
      <span class="promo-node promo-node--four"></span>
      <span class="promo-node promo-node--five"></span>
    </div>
  </article>
</aside>
