<style>
    :root {
        --pass-glow: rgba(239, 68, 68, 0.4);
        --star-glow: rgba(255, 193, 7, 0.4);
        --vote-glow: rgba(74, 222, 128, 0.4);
    }

    .vote-immersive-universe {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        overflow: hidden;
    }

    .dynamic-ambient-bg {
        position: absolute;
        inset: -10%;
        background-size: cover;
        background-position: center;
        filter: blur(80px) brightness(0.4);
        opacity: 0.6;
        transition: background-image 1s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.5s;
        z-index: 0;
        transform: scale(1.1);
    }

    .dynamic-ambient-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 0%, #000 80%);
    }

    .vote-app-adv {
        width: 100%;
        max-width: 440px;
        height: 92vh;
        display: flex;
        flex-direction: column;
        position: relative;
        padding: 1.5rem;
        z-index: 10;
    }

    .vote-brand-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
    }

    .brand-logo {
        font-family: "Manrope", sans-serif;
        font-weight: 900;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
        color: white;
    }

    .brand-accent {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .brand-actions {
        display: flex;
        gap: 1.2rem;
        color: rgba(255, 255, 255, 0.3);
    }

    .vote-timeline {
        display: flex;
        align-items: center;
        gap: 1.2rem;
        margin-bottom: 2.5rem;
    }

    .vote-meta-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        background: rgba(10, 10, 12, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 1.2rem;
        padding: 0.8rem 1rem 0.8rem 1.4rem;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
    }

    .vmb-left {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
    }

    .vmb-left strong {
        font-family: "Manrope", sans-serif;
        font-size: 1.05rem;
        font-weight: 800;
        color: white;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .vmb-left span {
        font-size: 0.72rem;
        color: #fbbf24;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.12em;
    }

    .vmb-left span.is-closed {
        color: #ff9d9d;
    }

    .vmb-avatar {
        width: 2.6rem;
        height: 2.6rem;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(165, 165, 255, 0.2), rgba(210, 119, 255, 0.1));
        border: 2px solid rgba(255, 255, 255, 0.1);
        font-family: "Manrope", sans-serif;
        font-weight: 800;
        font-size: 1rem;
        color: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .tl-progress-bar {
        flex: 1;
        height: 3px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 99px;
        overflow: hidden;
    }

    .tl-fill {
        width: 0%;
        height: 100%;
        background: var(--primary);
        box-shadow: 0 0 15px var(--primary);
        transition: width 0.05s linear;
        /* Smooth for timer */
    }

    .pulse-dot {
        width: 8px;
        height: 8px;
        background: var(--primary);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--primary);
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% {
            transform: scale(1);
            opacity: 1;
        }

        50% {
            transform: scale(1.5);
            opacity: 0.5;
        }

        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    .tl-label {
        font-family: "Manrope", sans-serif;
        font-size: 0.8rem;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.4);
    }

    /* Tinder Stack Specifics */
    .vote-viewport {
        flex: 1;
        position: relative;
        margin-bottom: 3.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .vote-deck-stack {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .card-container {
        position: absolute;
        width: 100%;
        height: 100%;
        transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.4s;
        cursor: grab;
        border-radius: 3rem;
        overflow: hidden;
    }

    .card-container:active {
        cursor: grabbing;
    }

    .adv-vote-card {
        height: 100%;
        background: #0f0f11;
        border-radius: 3rem;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        box-shadow: 0 50px 120px rgba(0, 0, 0, 0.9);
        border: 2px solid rgba(255, 255, 255, 0.08);
        /* Stronger border */
        transition: border-color 0.1s linear;
    }

    /* Decision Overlays - on card-container, outside overflow:hidden */
    .card-decision-overlay {
        display: none;
        /* Using box-shadow glow on container instead */
    }

    .card-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
    }

    .card-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.8s ease;
    }

    .card-container:hover .card-bg img {
        transform: scale(1.05);
    }

    .card-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.4) 40%, transparent 70%);
    }

    .card-content-adv {
        position: relative;
        padding: 3.5rem 2.2rem;
        z-index: 2;
        background: linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
        backdrop-filter: blur(4px);
    }

    .card-details-panel {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 2rem;
        padding: 1.8rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        margin-top: 1rem;
    }

    .card-tags {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 1.2rem;
    }

    .tag-pill {
        background: rgba(165, 165, 255, 0.15);
        padding: 0.5rem 1rem;
        border-radius: 99px;
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--primary);
        border: 1px solid rgba(165, 165, 255, 0.2);
    }

    .card-details-panel h2 {
        font-family: "Manrope", sans-serif;
        font-size: 2.2rem;
        font-weight: 900;
        margin-bottom: 0.6rem;
        line-height: 1.1;
        color: white;
        letter-spacing: -0.03em;
    }

    .card-details-panel p {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
    }

    .card-meta-row {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        color: rgba(255, 255, 255, 0.3);
        font-size: 0.85rem;
        font-weight: 700;
    }

    .meta-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .meta-item .material-symbols-outlined {
        font-size: 1.1rem;
    }

    /* Swipe Animations */
    .card-container.is-removed-left {
        transform: translate(-160%, 15%) rotate(-45deg) !important;
        opacity: 0;
    }

    .card-container.is-removed-right {
        transform: translate(160%, 15%) rotate(45deg) !important;
        opacity: 0;
    }

    .swipe-feedback {
        position: fixed;
        top: 25%;
        z-index: 10000;
        padding: 0.8rem 2rem;
        border: 6px solid currentColor;
        border-radius: 1rem;
        font-family: "Manrope", sans-serif;
        font-size: 3rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0;
        pointer-events: none;
        backdrop-filter: blur(10px);
        transition: opacity 0.1s linear, transform 0.1s linear;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
    }

    .swipe-like {
        color: #4ade80;
        left: 10%;
        transform: rotate(-15deg) scale(0.8);
    }

    .swipe-nope {
        color: #f87171;
        right: 10%;
        transform: rotate(15deg) scale(0.8);
    }

    /* Holographic Data Drawer */
    .vote-drawer {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%) translateY(calc(100% - 3.5rem));
        width: 100%;
        max-width: 440px;
        background: rgba(10, 10, 12, 0.98);
        -webkit-backdrop-filter: blur(40px);
        backdrop-filter: blur(40px);
        border-radius: 2.5rem 2.5rem 0 0;
        border: 1px solid rgba(255, 255, 255, 0.12);
        z-index: 30000;
        transition: transform 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        padding: 0 1.5rem 2.5rem;
        box-shadow: 0 -20px 80px rgba(0, 0, 0, 0.9);
    }

    .vote-drawer.is-open {
        transform: translateX(-50%) translateY(0);
    }

    .drawer-trigger {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
        padding: 1rem 0;
        color: rgba(255, 255, 255, 0.4);
        background: transparent;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
    }

    .drawer-trigger .material-symbols-outlined {
        font-size: 1.4rem;
        transition: transform 0.4s;
    }

    .vote-drawer.is-open .drawer-trigger .material-symbols-outlined {
        transform: rotate(180deg);
        color: var(--primary);
    }

    .drawer-content {
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.5s 0.2s;
        max-height: 60vh;
        overflow-y: auto;
        padding-top: 1rem;
    }

    .vote-drawer.is-open .drawer-content {
        opacity: 1;
        transform: translateY(0);
    }

    /* Live Board & State Styles within Drawer */
    .vote-live-board,
    .vote-my-state {
        margin-bottom: 2rem;
    }

    .vote-live-board__header,
    .vote-my-state__header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.2rem;
        padding-bottom: 0.8rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .vote-live-board__header strong,
    .vote-my-state__header strong {
        font-size: 0.85rem;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.9);
    }

    .vote-live-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 1.2rem;
        margin-bottom: 0.8rem;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .vi-card-mini strong {
        display: block;
        font-size: 0.95rem;
        margin-bottom: 0.1rem;
    }

    .vi-card-mini span {
        font-size: 0.75rem;
        color: #7f7b84;
    }

    .vi-score {
        font-weight: 900;
        color: var(--primary);
        background: rgba(165, 165, 255, 0.1);
        padding: 0.4rem 0.8rem;
        border-radius: 0.8rem;
    }

    /* Global tint for decision direction */
    #vote-tint {
        position: fixed;
        inset: 0;
        z-index: 9998;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.1s linear, background-color 0.1s linear;
    }

    /* Float Actions - REDESIGNED FOR GOD MODE */
    .vote-float-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        z-index: 20000;
        margin-bottom: 2rem;
        position: relative;
    }

    .fa-btn {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 50%;
        background: rgba(20, 20, 22, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
    }

    .fa-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(255, 255, 255, 0.1), transparent);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .fa-btn:hover::after {
        opacity: 1;
    }

    .fa-btn:hover {
        transform: translateY(-8px) scale(1.1);
        color: white;
    }

    .fa-btn-skip:hover {
        background: #ef4444;
        border-color: #ef4444;
        box-shadow: 0 15px 40px var(--pass-glow);
    }

    .fa-btn-star:hover {
        background: #fbbf24;
        border-color: #fbbf24;
        color: #000;
        box-shadow: 0 15px 40px var(--star-glow);
    }

    .fa-btn-vote {
        width: 6rem;
        height: 6rem;
        background: var(--primary);
        color: #000;
        border: none;
        box-shadow: 0 20px 50px rgba(165, 165, 255, 0.4);
    }

    .fa-btn-vote:hover {
        transform: translateY(-10px) scale(1.15) rotate(5deg);
        box-shadow: 0 30px 70px rgba(165, 165, 255, 0.6);
        background: white;
    }

    .fa-btn .material-symbols-outlined {
        font-size: 1.8rem;
        font-variation-settings: 'FILL' 1, 'wght' 700;
    }

    .fa-btn-vote .material-symbols-outlined {
        font-size: 2.2rem;
    }

    .vote-empty-state {
        text-align: center;
        padding: 4rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
    }


    .vote-state-item__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }

    .vote-state-item__head strong {
        color: white;
        font-size: 0.95rem;
    }

    .vote-state-badge {
        padding: 0.35rem 0.6rem;
        border-radius: 999px;
        font-size: 0.68rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.12em;
    }

    .vote-state-badge--up {
        background: rgba(74, 222, 128, 0.16);
        color: #98f0b5;
    }

    .vote-state-badge--down {
        background: rgba(239, 68, 68, 0.16);
        color: #ff9d9d;
    }

    .vote-state-badge--none {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.7);
    }

    .vote-state-actions {
        display: flex;
        gap: 0.65rem;
    }

    .vote-state-btn {
        flex: 1;
        min-height: 2.5rem;
        border-radius: 0.9rem;
        background: rgba(255, 255, 255, 0.06);
        color: white;
        font-size: 0.78rem;
        font-weight: 800;
    }

    .vote-state-btn.is-active-up {
        background: rgba(74, 222, 128, 0.18);
        color: #98f0b5;
    }

    .vote-state-btn.is-active-down {
        background: rgba(239, 68, 68, 0.18);
        color: #ff9d9d;
    }

    .empty-icon {
        font-size: 4rem;
        filter: drop-shadow(0 0 20px rgba(165, 165, 255, 0.5));
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {

        0%,
        100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-20px);
        }
    }
</style>
